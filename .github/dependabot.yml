version: 2
updates:
  # The uv ecosystem resolves pyproject.toml pins and uv.lock together.
  # The pip ecosystem would bump pyproject.toml and leave uv.lock stale.
  - package-ecosystem: "uv"
    directory: "/"
    # Version updates wait in dev for the next release; security updates
    # ignore this and always target main.
    target-branch: "dev"
    schedule:
      interval: "weekly"
    # A release must be a week old before it is proposed: most compromised
    # releases are caught and yanked within days.
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    # Actions are pinned by SHA, so every new version arrives through here.
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
