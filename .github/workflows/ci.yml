name: Lint and Test
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true

on:
  push:
    branches-ignore:
      - main
      - dev
      - gh-pages
  # No paths-ignore: ci-ok is a required check, and a pull request it never
  # reports on cannot be merged.
  pull_request:
  workflow_dispatch:

permissions: {}

# setup-uv steps pin uv in the workflow rather than in pyproject.toml: an exact
# required-version there would also bind Dependabot, whose uv differs.
jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.11']
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install the locked dependencies
        run: uv sync --locked
      - name: Check generated sync client is up to date
        run: uv run python scripts/unasync.py --check
      - name: Lint with ruff
        run: uv run ruff check
      - name: Check formatting with ruff
        run: uv run ruff format --check
      - name: Typing checks with mypy
        run: uv run mypy
      - name: Test with pytest
        run: uv run pytest
      - name: Audit the locked dependencies
        run: |
          uv export --format requirements-txt --no-emit-project --all-groups \
            | uv run pip-audit --strict --disable-pip --require-hashes -r /dev/stdin

  full_tests:
    needs: test
    # Only run when there is activity on a pull request or when manually triggered
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest, windows-latest, macos-latest]
        exclude:
          # Already run in previous test job
          - os: ubuntu-latest
            python-version: '3.11'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install the locked dependencies
        run: uv sync --locked
      - name: Test with pytest
        run: uv run pytest

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit the workflows with zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  # The one check the branch ruleset requires. It fails when any job it needs
  # failed or was cancelled, so the test matrix can change without the ruleset
  # changing with it. full_tests is skipped on push by design, and skipped on a
  # pull request only when test failed, which already fails this job.
  ci-ok:
    if: ${{ always() }}
    needs: [test, full_tests, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if a needed job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
