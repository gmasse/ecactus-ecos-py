name: Publish to PyPI
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

# Releases only: the pypi environment accepts tags v* and nothing else, so a
# manual run from a branch could not publish anyway.
on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All branches, so the next step can tell whether the tag is on main.
          fetch-depth: 0
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.1
          # A cache written by another workflow must not reach the published build.
          enable-cache: false
      # A version number cannot be reused on PyPI, so a v* tag pushed by mistake
      # must stop here. This catches a mistake, not a stolen admin token: the
      # workflow runs from the tagged commit, which could rewrite this step.
      - name: Check the tag matches the version and is on main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(uv version --short)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match version $version in pyproject.toml, expected v$version."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $TAG points to $(git rev-parse HEAD), which is not on main."
            exit 1
          fi
      # The build backend is pinned in pyproject.toml. The publish action
      # checks the metadata before uploading, so no separate twine check.
      - name: Build distributions
        run: uv build
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/ecactus-ecos-py
    # Trusted publishing swaps this OIDC token for a short-lived PyPI upload
    # credential, so no API token is stored in the repository. Keep the
    # permission on this job only, so the build never sees it.
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
